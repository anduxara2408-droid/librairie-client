<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résultats de recherche - MAURILIVRES</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
</head>
<body>

    <!-- TOP BAR (identique à index.html) -->
    <div class="top-bar">
        <div class="left">📚 Leader de l'occasion en Mauritanie</div>
        <div class="center">
            <span>📦 Livraison offerte dès 150 MRU</span>
            <span>🔒 Paiement sécurisé</span>
            <span>📞 Service client 41291914</span>
        </div>
        <div class="right">
            <span>⭐ Avantages fidélité (bientôt)</span>
            <span><a href="aide.html" style="color:#fff;">❓ Besoin d'aide</a></span>
        </div>
    </div>

    <!-- HEADER complet -->
    <header class="header">
        <div class="container header-top">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; gap:8px;">
                    <img src="images/maurilivres.jpeg" alt="MAURILIVRES" />
                    <span>MAURILIVRES</span>
                </a>
            </div>
            <div class="search-bar">
                <form id="searchForm" onsubmit="event.preventDefault(); performSearch();">
                    <select id="searchCategory">
                        <option value="all">Tous les livres</option>
                        <option value="roman">Romans</option>
                        <option value="developpement">Développement personnel</option>
                        <option value="scolaire">Scolaire</option>
                        <option value="poesie">Poésie</option>
                        <option value="manga">Mangas</option>
                        <option value="jeunesse">Jeunesse</option>
                        <option value="bd">BD</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Rechercher un livre…" />
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="user-nav">
                <a href="#" onclick="showFavorites()">
                    <i class="fas fa-heart"></i>
                    <span>Favoris</span>
                    <span class="badge" id="favoriteCount">0</span>
                </a>
                <a href="#" onclick="toggleLogin()">
                    <i class="fas fa-user"></i>
                    <span>Compte</span>
                </a>
                <a href="#" onclick="showCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Panier</span>
                    <span class="badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="container">
        <section style="margin:40px 0;">
            <h2 id="resultTitle" class="section-title">Résultats de recherche</h2>
            <div id="searchResults"></div>
            <div id="suggestions" style="margin-top:40px;"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 MAURILIVRES – Fondée par Salihina Moussa Konaté.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cookies.js"></script>
    <script>
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('searchCategory').value;
            if (!query) {
                document.getElementById('searchResults').innerHTML = '<p style="color:#6c757d;">Veuillez saisir un terme de recherche.</p>';
                return;
            }
            const results = booksData.filter(b => {
                const matchTitle = b.title.toLowerCase().includes(query.toLowerCase());
                const matchAuthor = b.author.toLowerCase().includes(query.toLowerCase());
                const matchCategory = category === 'all' || b.category === category;
                return (matchTitle || matchAuthor) && matchCategory;
            });
            displayResults(results, query);
        }

        function displayResults(results, query) {
            const container = document.getElementById('searchResults');
            const suggestionsContainer = document.getElementById('suggestions');
            if (results.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px;">
                        <i class="fas fa-search" style="font-size:3rem; color:#ccc;"></i>
                        <h3 style="margin:20px 0;">Aucun résultat pour "<strong>${query}</strong>"</h3>
                        <p style="color:#6c757d;">Essayez avec d'autres mots-clés ou consultez notre catalogue.</p>
                        <a href="index.html" style="display:inline-block; margin-top:20px; padding:10px 30px; background:#145daa; color:#fff; border-radius:8px;">Retour à l'accueil</a>
                    </div>
                `;
                suggestionsContainer.innerHTML = '';
                return;
            }

            const first = results[0];
            container.innerHTML = `
                <div style="display:flex; flex-wrap:wrap; gap:30px; background:#fff; padding:30px; border-radius:12px; border:1px solid #e9ecef;">
                    <div style="flex:0 0 200px;">
                        <img src="${first.image}" alt="${first.title}" style="width:100%; border-radius:8px;" onerror="this.src='https://placehold.co/200x280/145daa/fff?text=Livre'">
                    </div>
                    <div style="flex:1; min-width:250px;">
                        <h2 style="font-size:2rem; margin-bottom:5px;">${first.title}</h2>
                        <p style="font-size:1.1rem; color:#6c757d;">par ${first.author}</p>
                        <p style="font-size:1.5rem; font-weight:700; color:#145daa; margin:15px 0;">${first.price} MRU</p>
                        <p style="line-height:1.8; color:#444;">${first.description}</p>
                        <div style="margin-top:20px;">
                            <button onclick="addToCart(${first.id})" style="padding:12px 30px; background:#145daa; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
                                <i class="fas fa-shopping-cart"></i> Ajouter au panier
                            </button>
                            <button onclick="location.href='book.html?id=${first.id}'" style="padding:12px 20px; background:#f1f3f5; border:none; border-radius:8px; cursor:pointer; margin-left:10px;">
                                <i class="fas fa-arrow-right"></i> Voir détails
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const others = results.slice(1);
            if (others.length > 0) {
                suggestionsContainer.innerHTML = `
                    <h3 class="section-title" style="font-size:1.3rem;">Autres suggestions</h3>
                    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:20px; margin-top:20px;">
                        ${others.map(book => `
                            <div style="background:#fff; border-radius:12px; padding:15px; border:1px solid #e9ecef; text-align:center;">
                                <img src="${book.image}" alt="${book.title}" style="width:100%; height:160px; object-fit:cover; border-radius:8px;" onerror="this.src='https://placehold.co/180x160/145daa/fff?text=Livre'">
                                <h4 style="font-size:0.95rem; margin:8px 0;">${book.title}</h4>
                                <p style="font-size:0.8rem; color:#6c757d;">${book.author}</p>
                                <p style="font-weight:700; color:#145daa;">${book.price} MRU</p>
                                <button onclick="location.href='book.html?id=${book.id}'" style="margin-top:5px; padding:4px 12px; background:#145daa; color:#fff; border:none; border-radius:4px; cursor:pointer;">Voir</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                suggestionsContainer.innerHTML = '';
            }
            document.getElementById('resultTitle').textContent = `${results.length} résultat${results.length > 1 ? 's' : ''} pour "${query}"`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                document.getElementById('searchInput').value = q;
                performSearch();
            }
            document.getElementById('searchInput').addEventListener('input', performSearch);
            document.getElementById('searchCategory').addEventListener('change', performSearch);
            // Mettre à jour les badges
            if (typeof updateCartCount === 'function') updateCartCount();
            if (typeof updateFavoriteCount === 'function') updateFavoriteCount();
        });

        window.performSearch = performSearch;
    </script>
</body>
</html>
