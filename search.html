<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Résultats de recherche - MAURILIVRES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* ============================================================
               STYLES GLOBAUX (reprise de index.html)
               ============================================================ */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { overflow-x: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            color: #1a1a2e;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; height: auto; display: block; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; width: 100%; overflow-x: hidden; }

        .top-bar {
            background: #145daa;
            color: #fff;
            padding: 6px 10px;
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(5px, 1.5vw, 20px);
            flex-wrap: wrap;
            text-align: center;
            width: 100%;
        }
        .top-bar .left { font-weight: 600; letter-spacing: 0.3px; font-size: clamp(0.55rem, 1vw, 0.75rem); }
        .top-bar .center, .top-bar .right {
            display: flex;
            gap: clamp(8px, 1.5vw, 20px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .top-bar .center span, .top-bar .right span {
            cursor: pointer;
            opacity: 0.9;
            font-size: clamp(0.5rem, 0.9vw, 0.7rem);
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .top-bar .center, .top-bar .right { display: none; }
            .top-bar { padding: 4px 8px; }
            .top-bar .left { font-size: 0.65rem; }
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            width: 100%;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 0;
            width: 100%;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .logo img { height: clamp(32px, 4vw, 45px); width: auto; }
        .logo span { font-size: clamp(0.9rem, 2vw, 1.3rem); font-weight: 700; color: #145daa; letter-spacing: -0.5px; }

        .search-bar {
            flex: 1 1 180px;
            min-width: 120px;
            max-width: 100%;
        }
        .search-bar form {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            width: 100%;
        }
        .search-bar select {
            padding: 6px 8px;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            font-size: clamp(0.6rem, 0.8vw, 0.8rem);
            color: #333;
            max-width: 80px;
            flex-shrink: 0;
        }
        .search-bar input {
            flex: 1;
            padding: 6px 10px;
            border: none;
            outline: none;
            font-size: clamp(0.7rem, 0.9vw, 0.9rem);
            min-width: 60px;
            width: 100%;
        }
        .search-bar button {
            padding: 6px 12px;
            background: #145daa;
            color: #fff;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .search-bar button:hover { background: #0d4a8a; }

        .user-nav {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 15px);
            flex-shrink: 0;
        }
        .user-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            font-size: clamp(0.5rem, 0.7vw, 0.7rem);
            position: relative;
        }
        .user-nav a:hover { color: #145daa; }
        .user-nav a i { font-size: clamp(1rem, 1.5vw, 1.2rem); }
        .user-nav .badge {
            background: #145daa;
            color: #fff;
            border-radius: 50%;
            padding: 0 4px;
            font-size: clamp(0.5rem, 0.6vw, 0.65rem);
            position: absolute;
            top: -5px;
            right: -8px;
            min-width: 16px;
            text-align: center;
            line-height: 16px;
        }
        @media (max-width: 600px) {
            .user-nav a span { display: none; }
            .user-nav a i { font-size: 1.1rem; }
        }

        .footer {
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 30px 15px 15px;
            margin-top: 30px;
            width: 100%;
        }
        .footer-bottom {
            text-align: center;
            font-size: clamp(0.7rem, 0.9vw, 0.85rem);
            padding: 12px 0 4px;
            border-top: 1px solid #2a2a40;
            color: #888;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 14px;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: clamp(30px, 5vw, 50px);
            height: 3px;
            background: #145daa;
            border-radius: 2px;
        }

        .result-card {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            margin-bottom: 20px;
        }
        .result-card .image { flex: 0 0 clamp(120px, 20vw, 180px); }
        .result-card .image img { width: 100%; border-radius: 8px; }
        .result-card .info { flex: 1; min-width: 200px; }
        .result-card .info h2 { font-size: clamp(1.2rem, 2vw, 1.8rem); margin-bottom: 4px; }
        .result-card .info .author { font-size: clamp(0.9rem, 1.2vw, 1.1rem); color: #6c757d; }
        .result-card .info .price { font-size: clamp(1.2rem, 1.8vw, 1.5rem); font-weight: 700; color: #145daa; margin: 10px 0; }
        .result-card .info .description { font-size: clamp(0.8rem, 1vw, 0.95rem); color: #444; line-height: 1.6; }
        .result-card .info .actions { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
        .result-card .info .actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: clamp(0.75rem, 1vw, 0.9rem);
        }
        .result-card .info .actions .btn-cart { background: #145daa; color: #fff; }
        .result-card .info .actions .btn-cart:hover { background: #0d4a8a; }
        .result-card .info .actions .btn-detail { background: #f1f3f5; color: #333; }
        .result-card .info .actions .btn-detail:hover { background: #e9ecef; }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 18vw, 180px), 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .suggestion-card {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #e9ecef;
            text-align: center;
        }
        .suggestion-card img {
            width: 100%;
            height: clamp(140px, 22vw, 180px);
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .suggestion-card h4 { font-size: clamp(0.8rem, 1vw, 0.9rem); margin: 4px 0; }
        .suggestion-card .price { font-weight: 700; color: #145daa; font-size: clamp(0.75rem, 1vw, 0.85rem); }
        .suggestion-card .btn-view {
            margin-top: 6px;
            padding: 4px 12px;
            background: #145daa;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(0.65rem, 0.8vw, 0.75rem);
        }
        .suggestion-card .btn-view:hover { background: #0d4a8a; }

        .no-results {
            text-align: center;
            padding: 40px 20px;
        }
        .no-results i { font-size: 3rem; color: #ccc; }
        .no-results h3 { margin: 20px 0; font-size: clamp(1.2rem, 2vw, 1.5rem); }
        .no-results p { color: #6c757d; font-size: clamp(0.85rem, 1.1vw, 1rem); }
        .no-results .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            background: #145daa;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
        }
        .no-results .btn-home:hover { background: #0d4a8a; }

        @media (max-width: 600px) {
            .result-card .image { flex: 0 0 100%; max-width: 200px; margin: 0 auto; }
            .result-card .info { text-align: center; }
            .result-card .info .actions { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="left">📚 Leader de l'occasion en Mauritanie</div>
        <div class="center">
            <span>📦 Livraison offerte dès 150 MRU</span>
            <span>🔒 Paiement sécurisé</span>
            <span>📞 Service client 41291914</span>
        </div>
        <div class="right">
            <span>⭐ Avantages fidélité (bientôt)</span>
            <span><a href="aide.html" style="color:#fff;">❓ Besoin d'aide</a></span>
        </div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-top">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; gap:6px;">
                    <img src="images/maurilivres.jpeg" alt="MAURILIVRES" />
                    <span>MAURILIVRES</span>
                </a>
            </div>
            <div class="search-bar">
                <form id="searchForm" onsubmit="event.preventDefault(); performSearch();">
                    <select id="searchCategory">
                        <option value="all">Tous</option>
                        <option value="roman">Romans</option>
                        <option value="developpement">Développement</option>
                        <option value="scolaire">Scolaire</option>
                        <option value="poesie">Poésie</option>
                        <option value="manga">Mangas</option>
                        <option value="jeunesse">Jeunesse</option>
                        <option value="bd">BD</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Rechercher…" />
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="user-nav">
                <a href="#" onclick="showFavorites()">
                    <i class="fas fa-heart"></i>
                    <span>Favoris</span>
                    <span class="badge" id="favoriteCount">0</span>
                </a>
                <a href="#" onclick="toggleLogin()">
                    <i class="fas fa-user"></i>
                    <span>Compte</span>
                </a>
                <a href="#" onclick="showCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Panier</span>
                    <span class="badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <section style="margin:30px 0;">
            <h2 id="resultTitle" class="section-title">Résultats de recherche</h2>
            <div id="searchResults"></div>
            <div id="suggestions" style="margin-top:30px;"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 MAURILIVRES – Fondée par Salihina Moussa Konaté.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cookies.js"></script>
    <script>
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('searchCategory').value;
            if (!query) {
                document.getElementById('searchResults').innerHTML = '<p style="color:#6c757d; text-align:center; padding:20px;">Veuillez saisir un terme de recherche.</p>';
                return;
            }
            const results = booksData.filter(b => {
                const matchTitle = b.title.toLowerCase().includes(query.toLowerCase());
                const matchAuthor = b.author.toLowerCase().includes(query.toLowerCase());
                const matchCategory = category === 'all' || b.category === category;
                return (matchTitle || matchAuthor) && matchCategory;
            });
            displayResults(results, query);
        }

        function displayResults(results, query) {
            const container = document.getElementById('searchResults');
            const suggestionsContainer = document.getElementById('suggestions');
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>Aucun résultat pour "<strong>${query}</strong>"</h3>
                        <p>Essayez avec d'autres mots-clés ou consultez notre catalogue.</p>
                        <a href="index.html" class="btn-home">Retour à l'accueil</a>
                    </div>
                `;
                suggestionsContainer.innerHTML = '';
                return;
            }

            const first = results[0];
            container.innerHTML = `
                <div class="result-card">
                    <div class="image">
                        <img src="${first.image}" alt="${first.title}" onerror="this.src='https://placehold.co/300x400/145daa/fff?text=Livre'">
                    </div>
                    <div class="info">
                        <h2>${first.title}</h2>
                        <p class="author">par ${first.author}</p>
                        <p class="price">${first.price} MRU</p>
                        <p class="description">${first.description}</p>
                        <div class="actions">
                            <button class="btn-cart" onclick="addToCart(${first.id})"><i class="fas fa-shopping-cart"></i> Ajouter</button>
                            <button class="btn-detail" onclick="location.href='book.html?id=${first.id}'"><i class="fas fa-arrow-right"></i> Voir détails</button>
                        </div>
                    </div>
                </div>
            `;

            const others = results.slice(1);
            if (others.length > 0) {
                suggestionsContainer.innerHTML = `
                    <h3 class="section-title" style="font-size:clamp(1.1rem,1.8vw,1.3rem);">Autres suggestions</h3>
                    <div class="suggestions-grid">
                        ${others.map(book => `
                            <div class="suggestion-card">
                                <img src="${book.image}" alt="${book.title}" onerror="this.src='https://placehold.co/200x280/145daa/fff?text=Livre'">
                                <h4>${book.title}</h4>
                                <p style="font-size:clamp(0.7rem,0.8vw,0.8rem); color:#6c757d;">${book.author}</p>
                                <p class="price">${book.price} MRU</p>
                                <button class="btn-view" onclick="location.href='book.html?id=${book.id}'">Voir</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                suggestionsContainer.innerHTML = '';
            }
            document.getElementById('resultTitle').textContent = `${results.length} résultat${results.length > 1 ? 's' : ''} pour "${query}"`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q) {
                document.getElementById('searchInput').value = q;
                performSearch();
            }
            document.getElementById('searchInput').addEventListener('input', performSearch);
            document.getElementById('searchCategory').addEventListener('change', performSearch);
            if (typeof updateCartCount === 'function') updateCartCount();
            if (typeof updateFavoriteCount === 'function') updateFavoriteCount();
        });

        window.performSearch = performSearch;
    </script>
</body>
</html>
